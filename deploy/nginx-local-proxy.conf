# ==============================================================================
# NGINX LOCAL PROXY CONFIGURATION FOR GRAYWOOD READER
# ==============================================================================
# This file provides reverse-proxy configuration for local Nginx.
# It proxies requests from port 8080 (or custom domain) to http://127.0.0.1:3000
# with WebSocket HMR support, image stream buffering, and SSE headers.
# ==============================================================================

server {
    listen       8080;
    server_name  localhost reader.graywood.local;

    # Client body size limit for database imports and backup JSON payloads
    client_max_body_size 50M;

    # ===========================================================================
    # SECURITY HEADERS — applied to every response from this server block
    # ===========================================================================

    # Prevent this app from being embedded in a foreign <iframe> or <frame>
    add_header X-Frame-Options "DENY" always;

    # Stop browsers from MIME-sniffing response bodies to infer a different type
    add_header X-Content-Type-Options "nosniff" always;

    # Only send the origin as the Referer on cross-origin requests (no full path)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # NOTE: unsafe-inline is required for the current Vite bundle which injects
    # inline <script> and <style> blocks. A future hardening step should add a
    # server-generated nonce to every inline tag and replace 'unsafe-inline' here.
    # TODO: Replace 'unsafe-inline' with nonce-based CSP after Vite refactor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # ===========================================================================
    # INTERNAL PATH BLOCKING
    # Block direct HTTP access to internal directories that must never be served
    # to clients. This is a defence-in-depth layer — the Node.js app also refuses
    # to serve these paths, but Nginx rejects them before proxying even begins.
    # ===========================================================================

    # Block access to the SQLite database, raw data exports, scripts, and git repo
    location ~* ^/(data|db|scripts|\.git)(/|$) {
        deny all;
        return 403;
    }

    # Block dot-file access (e.g. /.env, /.gitignore, /.dockerignore)
    location ~ /\. {
        deny all;
        return 403;
    }

    # ===========================================================================
    # WEBSOCKET & APPLICATION ROUTING
    # ===========================================================================

    # Proxy headers (applied globally for all location blocks below)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Support for Vite HMR Development Server
    location /@vite/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # API Proxy Routing (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static Assets & App Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Error handling (Custom 502 / 50x Bad Gateway & Maintenance Page)
    error_page   502 503 504  /502.html;
    location = /502.html {
        root   html; # or /app/dist or /usr/share/nginx/html
        internal;
    }

    error_page   500  /50x.html;
    location = /50x.html {
        root   html;
        internal;
    }
}

