# ==============================================================================
# NGINX LOCAL PROXY CONFIGURATION FOR OMNIMANGA HUB / MANHUASYNC
# ==============================================================================
# This file provides reverse-proxy testhosting configuration for local Nginx.
# It proxies requests from port 8080 (or custom domain) to http://127.0.0.1:3000
# with WebSocket HMR support, image stream buffering, and CORS headers.
# ==============================================================================

server {
    listen       8080;
    server_name  localhost tracker.manhuahub.local omnimanga.local;

    # Client body size limit for database imports and backup JSON payloads
    client_max_body_size 50M;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Support for Vite HMR Development Server
    location /@vite/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # API Proxy Routing (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static Assets & App Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Error handling
    error_page   500 502 503 504  /5x.html;
    location = /5x.html {
        root   html;
    }
}
