<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5e54"/>
      <stop offset="50%" stop-color="#6b8f7e"/>
      <stop offset="100%" stop-color="#8aac9a"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c4a3a"/>
      <stop offset="100%" stop-color="#7a6450"/>
    </linearGradient>
  </defs>
  <!-- Rounded app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#6b8f7e" stroke-opacity="0.25" stroke-width="8"/>
  <!-- Open book (reader) -->
  <path d="M156 380 C 196 364, 236 360, 256 364 L 256 420 C 236 416, 196 420, 156 436 Z" fill="#e2e8f0" opacity="0.9"/>
