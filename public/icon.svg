  <path d="M244 290 C 220 270, 190 260, 160 265" stroke="#5c4a3a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M244 260 C 225 240, 200 225, 175 230" stroke="#5c4a3a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Right branch set -->
  <path d="M268 320 C 302 310, 332 280, 344 250" stroke="#5c4a3a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M268 290 C 292 270, 322 260, 352 265" stroke="#5c4a3a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M268 260 C 287 240, 312 225, 337 230" stroke="#5c4a3a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Canopy clusters -->
  <circle cx="168" cy="242" r="28" fill="url(#wood)"/>
  <circle cx="156" cy="265" r="24" fill="url(#wood)"/>
  <circle cx="185" cy="232" r="26" fill="url(#wood)"/>
  <circle cx="160" cy="230" r="22" fill="#8aac9a"/>
  <circle cx="344" cy="242" r="28" fill="url(#wood)"/>
  <circle cx="356" cy="265" r="24" fill="url(#wood)"/>
  <circle cx="327" cy="232" r="26" fill="url(#wood)"/>
  <circle cx="352" cy="230" r="22" fill="#8aac9a"/>
  <!-- Top canopy -->
  <circle cx="256" cy="180" r="34" fill="url(#wood)"/>
  <circle cx="230" cy="195" r="28" fill="url(#wood)"/>
  <circle cx="282" cy="195" r="28" fill="url(#wood)"/>
  <circle cx="256" cy="170" r="26" fill="#8aac9a"/>
  <circle cx="240" cy="185" r="22" fill="#8aac9a"/>
  <circle cx="272" cy="185" r="22" fill="#8aac9a"/>
