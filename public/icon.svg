  <path d="M256 364 L 256 420" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Book spine detail -->
  <line x1="256" y1="368" x2="256" y2="416" stroke="#334155" stroke-width="3"/>
  <!-- Tree trunk -->
  <path d="M244 364 L 244 240 C 244 232, 268 232, 268 240 L 268 364 Z" fill="url(#trunk)"/>
  <!-- Left branch set -->
