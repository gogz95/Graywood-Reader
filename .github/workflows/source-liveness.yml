name: Source Liveness

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan source liveness (sampled)
        id: liveness
        run: node scripts/catalog-liveness.mjs --sample 50 --patch

      - name: Run source audit report table
        if: always()
        run: |
          mkdir -p scratch
          node scripts/source-audit.mjs --out scratch/source-audit-report.json || true

      - name: Summarize liveness
        if: always()
        run: |
          if [ -f data/source-health.json ]; then
            node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync("./data/source-health.json", "utf8"));
              const arr = Array.isArray(d) ? d : (d.results || d.sources || []);
              const ok = arr.filter(s => s && (s.status === "ok" || s.httpStatus === 200)).length;
              const dead = arr.filter(s => s && (s.status === "dead" || String(s.status).startsWith("http-"))).length;
              const cf = arr.filter(s => s && s.status === "cf-blocked").length;
              const parked = arr.filter(s => s && s.status === "parked").length;
              console.log(`Scanned=${arr.length} ok=${ok} dead=${dead} cf-blocked=${cf} parked=${parked}`);
            '
          else
            echo "no liveness report produced"
          fi

      - name: Upload liveness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-liveness-${{ github.run_id }}
          path: |
            data/source-health.json
            scratch/source-audit-report.json
            scratch/source-audit-report.md
          if-no-files-found: ignore
