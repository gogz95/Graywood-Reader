services:
  graywood-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graywood-reader
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET in your environment}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-0}
      - STORAGE_PATH=/app/data/storage
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s