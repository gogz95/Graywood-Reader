services:
  manhuasync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manhuasync-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Provide a strong unique secret (>=32 chars). If unset, the server
      # manages its own key in /app/data/.encryption-secret.
      # - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET in your environment}
      - STORAGE_PATH=/app/data/storage
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
