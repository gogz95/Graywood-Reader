services:
  graywood-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graywood-reader
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/data/manga.db
      - STORAGE_PATH=/data
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-0}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s