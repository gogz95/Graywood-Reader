<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Graywood Reader — self-hosted manga, manhwa & manhua library tracker with an integrated Kotatsu-style reader, live source sync and multi-user profiles." />
    <meta name="theme-color" content="#020617" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Social / Open Graph -->
    <meta property="og:title" content="Graywood Reader" />
    <meta property="og:description" content="Self-hosted manga, manhwa & manhua library tracker with an integrated Kotatsu-style reader, live source sync and multi-user profiles." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Graywood Reader" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Graywood Reader" />
    <meta name="twitter:description" content="Self-hosted manga, manhwa & manhua library tracker with integrated reader and live source sync." />
    <!-- DNS / connection hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <link rel="dns-prefetch" href="//uploads.mangadex.org" />
    <link rel="dns-prefetch" href="//api.mangadex.org" />
    <link rel="preconnect" href="https://uploads.mangadex.org" crossorigin />
    <title>Graywood Reader</title>
  </head>
  <body class="h-full overflow-x-hidden bg-app text-primary font-sans antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
